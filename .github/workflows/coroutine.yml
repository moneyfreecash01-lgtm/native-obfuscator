name: Coroutine repro

# Focused pipeline for the suspend-function port of native-obfuscator.
#
# The full matrix lives in main.yml and takes ~15 jobs. This workflow only
# needs one Linux runner with g++/cmake to build the translated C++ of the
# coroutine repro test, plus the shaded obfuscator.jar as a downloadable
# artifact so it can be dropped into the Android pipeline locally.

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      allowed_tests:
        description: 'NOB_ALLOWED_TESTS filter (comma separated substrings)'
        required: false
        default: 'CoroutineResume'

permissions:
  contents: write

jobs:
  coroutine:
    runs-on: ubuntu-latest
    name: Build jar + run coroutine repro
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ cmake

      - name: Build obfuscator.jar
        run: ./gradlew :obfuscator:shadowJar --console=plain

      - name: Run coroutine tests
        env:
          CC: gcc
          CXX: g++
          NOB_ALLOWED_TESTS: ${{ github.event.inputs.allowed_tests || 'CoroutineResume' }}
        run: |
          set -o pipefail
          ./gradlew :obfuscator:test --console=plain \
            --tests 'by.radioegor146.TestsGenerator' \
            --tests 'by.radioegor146.KotlinCoroutineTest' \
            --tests 'by.radioegor146.WrappingArithmeticTest' 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Guard against a green run where the filter matched nothing.
      - name: Assert the coroutine test actually ran
        run: |
          ls -l obfuscator/build/test-results/test/ || true
          test -f obfuscator/build/test-results/test/TEST-by.radioegor146.KotlinCoroutineTest.xml
          test -f obfuscator/build/test-results/test/TEST-by.radioegor146.WrappingArithmeticTest.xml

      # Job logs are not downloadable without a token, so the test XML summary
      # (test counts + captured stdout/stderr) is committed back to the branch.
      - name: Publish run summary to repo
        if: always()
        run: |
          mkdir -p ci
          {
            echo "run: $GITHUB_RUN_ID"
            echo "sha: $GITHUB_SHA"
            echo
            found=0
            for f in obfuscator/build/test-results/test/*.xml; do
              [ -e "$f" ] || continue
              found=1
              echo "== $(basename "$f")"
              grep -o '<testsuite [^>]*>' "$f" | head -1
              sed -n '/<system-out>/,/<\/system-out>/p' "$f" | head -80
              echo
            done
            if [ "$found" = 0 ]; then
              echo "NO TEST RESULT XML FOUND - the suite did not run"
            fi
          } > ci/last-run.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci/last-run.txt
          git commit -m "ci: record run $GITHUB_RUN_ID [skip ci]" || exit 0
          git push

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: obfuscator/build/reports/tests/**

      - name: Upload obfuscator.jar
        uses: actions/upload-artifact@v4
        with:
          name: obfuscator-jar
          path: obfuscator/build/libs/obfuscator.jar
